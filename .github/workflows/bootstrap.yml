name: Bootstrap (first load)

# Run once, by hand, after the sandbox district is set up for SFTP sync.
# Generates the starting district, uploads it, and commits state/roster.json.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type LOAD to generate the district and upload it'
        required: true

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirm == 'LOAD'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEVER_DISTRICT_ID: ${{ secrets.CLEVER_DISTRICT_ID }}
      CLEVER_DISTRICT_TOKEN: ${{ secrets.CLEVER_DISTRICT_TOKEN }}
      CLEVER_SFTP_USERNAME: ${{ secrets.CLEVER_SFTP_USERNAME }}
      CLEVER_SFTP_PASSWORD: ${{ secrets.CLEVER_SFTP_PASSWORD }}
      CLEVER_SFTP_HOST_KEY: ${{ secrets.CLEVER_SFTP_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m sim init
      - name: Record the Events API starting point
        run: python -m sim events || echo "Events baseline skipped; the first drift run will set it."
      - run: scripts/commit-state.sh "Initial district load"
